<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon (LA-PLT-UC15-R01): brand/chuck.svg on a macOS icon plate, on Apple's grid (an 824 px
       plate with a 100 px margin that holds its shadow). Soft light from above: the plate brightens at the
       top, the chuck stands off it on a shadow, its body and jaws are shaded, and the bore sinks in.
       icon-small.svg is the same icon drawn bolder for 16 and 32 px. scripts/icon.ts renders both. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCFD"/>
      <stop offset="0.55" stop-color="#E9EEF0"/>
      <stop offset="1" stop-color="#CED7DC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#1D2830" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4B8FB0"/>
      <stop offset="0.5" stop-color="#2E6A88"/>
      <stop offset="1" stop-color="#1F4F68"/>
    </linearGradient>
    <linearGradient id="steel-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9D0E3" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#A9D0E3" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E2733" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8774A"/>
      <stop offset="1" stop-color="#9C421F"/>
    </linearGradient>
    <radialGradient id="bore" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#0E2733" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0E2733" stop-opacity="0.32"/>
    </radialGradient>
    <filter id="plate-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="chuck-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#0E2733" flood-opacity="0.35"/>
    </filter>
    <mask id="chuck-cut">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="32" r="9" fill="#000"/>
      <rect id="chuck-slot" x="27.5" y="0" width="9" height="24" fill="#000"/>
      <use href="#chuck-slot" transform="rotate(120 32 32)"/>
      <use href="#chuck-slot" transform="rotate(240 32 32)"/>
    </mask>
    <clipPath id="plate-clip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#plate-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g transform="translate(192 192) scale(10)">
    <g filter="url(#chuck-shadow)">
      <circle cx="32" cy="32" r="29" fill="url(#steel)" mask="url(#chuck-cut)"/>
    </g>
    <circle cx="32" cy="32" r="28.8" fill="none" stroke="url(#steel-edge)" stroke-width="0.4" mask="url(#chuck-cut)"/>
    <circle cx="32" cy="32" r="9" fill="url(#bore)"/>
    <g fill="url(#spark)" filter="url(#chuck-shadow)">
      <path id="chuck-jaw" d="M29.6 22.6V17.5H28.6V11H35.4V17.5H34.4V22.6Z"/>
      <use href="#chuck-jaw" transform="rotate(120 32 32)"/>
      <use href="#chuck-jaw" transform="rotate(240 32 32)"/>
    </g>
  </g>
  <!-- BAND -->
</svg>
