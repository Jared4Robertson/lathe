<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
  <title>About Lathe</title>
  <!-- The About window (desktop/src/launch.ts aboutModel, LA-DSK-UC05-R05). The model comes as JSON in
       ?model=; text is set with textContent only, and the links open through the main process. -->
  <style>
    :root { --bg: #DDE3E6; --ink: #1D2830; --steel: #2E6A88; --spark: #B5512A; color-scheme: light; }
    :root.is-dark { --steel: #7DB4D0; --spark: #E88A5E; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      padding: 28px 24px 22px; background: var(--bg); color: var(--ink);
      font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; cursor: default;
      -webkit-app-region: drag; app-region: drag;
    }
    .logo { width: 72px; height: 72px; }
    h1 { margin: 2px 0 4px; font-size: 15px; font-weight: 700; }
    dl { display: grid; grid-template-columns: auto auto; gap: 2px 10px; margin: 0; }
    dt { text-align: right; opacity: 0.65; }
    dd { margin: 0; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; -webkit-app-region: no-drag; app-region: no-drag; }
    .links { display: flex; gap: 14px; margin-top: 8px; }
    button {
      -webkit-app-region: no-drag; app-region: no-drag;
      font: inherit; padding: 0; border: 0; background: none; color: var(--steel); cursor: pointer;
    }
    button:hover { text-decoration: underline; }
    button:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; border-radius: 2px; }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <mask id="cut">
        <rect width="64" height="64" fill="#fff"/>
        <circle cx="32" cy="32" r="9" fill="#000"/>
        <rect id="slot" x="27.5" y="0" width="9" height="24" fill="#000"/>
        <use href="#slot" transform="rotate(120 32 32)"/>
        <use href="#slot" transform="rotate(240 32 32)"/>
      </mask>
    </defs>
    <circle cx="32" cy="32" r="29" fill="var(--steel)" mask="url(#cut)"/>
    <g fill="var(--spark)">
      <path id="jaw" d="M29.6 22.6V17.5H28.6V11H35.4V17.5H34.4V22.6Z"/>
      <use href="#jaw" transform="rotate(120 32 32)"/>
      <use href="#jaw" transform="rotate(240 32 32)"/>
    </g>
  </svg>
  <h1 id="name"></h1>
  <dl id="versions"></dl>
  <div class="links" id="links"></div>
  <script>
    (function () {
      var model;
      try { model = JSON.parse(new URLSearchParams(location.search).get('model') || '{}'); } catch (e) { model = {}; }
      var root = document.documentElement;
      var colors = model.colors || {};
      if (colors.background) root.style.setProperty('--bg', colors.background);
      if (colors.foreground) root.style.setProperty('--ink', colors.foreground);
      var hex = String(colors.background || '#DDE3E6').slice(1);
      var r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
      if ((0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.5) root.classList.add('is-dark');
      document.getElementById('name').textContent = model.name || 'Lathe';
      var list = document.getElementById('versions');
      (model.versions || []).forEach(function (v) {
        var dt = document.createElement('dt');
        dt.textContent = v.label;
        var dd = document.createElement('dd');
        dd.textContent = v.value;
        list.appendChild(dt);
        list.appendChild(dd);
      });
      var links = document.getElementById('links');
      (model.actions || []).forEach(function (action) {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = action.label;
        button.addEventListener('click', function () { window.latheLocal && window.latheLocal.act(action.id); });
        links.appendChild(button);
      });
    })();
  </script>
</body>
</html>
