<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
  <title>Lathe</title>
  <!-- The launch view and the error page (desktop/src/launch.ts, LA-DSK-UC05-R10 and R11), drawn over a
       window's app page. The model comes as JSON in ?model=; text is set with textContent only. -->
  <style>
    :root { --bg: #DDE3E6; --ink: #1D2830; --steel: #2E6A88; --spark: #B5512A; color-scheme: light; }
    :root.is-dark { --steel: #7DB4D0; --spark: #E88A5E; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; cursor: default;
      -webkit-app-region: drag; app-region: drag;
      transition: opacity 160ms ease-out;
    }
    body.is-leaving { opacity: 0; }
    main { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 520px; padding: 24px; text-align: center; }
    .logo { width: 72px; height: 72px; }
    .launch .logo { animation: turn 2.4s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .launch h1 { font-weight: 500; opacity: 0.75; }
    .error .logo { opacity: 0.55; }
    .message {
      margin: 0; max-height: 40vh; overflow: auto; padding: 10px 12px; border-radius: 8px;
      background: color-mix(in srgb, var(--ink) 7%, transparent);
      font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; text-align: left; white-space: pre-wrap; word-break: break-word;
      -webkit-user-select: text; user-select: text; cursor: text; -webkit-app-region: no-drag; app-region: no-drag;
    }
    .folder { margin: 0; font-size: 12px; opacity: 0.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
    button {
      -webkit-app-region: no-drag; app-region: no-drag;
      font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 6px; cursor: pointer;
      border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
      background: color-mix(in srgb, var(--bg) 70%, white); color: var(--ink);
    }
    :root.is-dark button { background: color-mix(in srgb, var(--bg) 80%, white); }
    button.primary { background: var(--steel); border-color: var(--steel); color: #fff; }
    :root.is-dark button.primary { color: #0A0F12; }
    button:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .launch .logo { animation: none; } body { transition: none; } }
  </style>
</head>
<body>
  <main id="page" aria-live="polite">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <mask id="cut">
          <rect width="64" height="64" fill="#fff"/>
          <circle cx="32" cy="32" r="9" fill="#000"/>
          <rect id="slot" x="27.5" y="0" width="9" height="24" fill="#000"/>
          <use href="#slot" transform="rotate(120 32 32)"/>
          <use href="#slot" transform="rotate(240 32 32)"/>
        </mask>
      </defs>
      <circle cx="32" cy="32" r="29" fill="var(--steel)" mask="url(#cut)"/>
      <g fill="var(--spark)">
        <path id="jaw" d="M29.6 22.6V17.5H28.6V11H35.4V17.5H34.4V22.6Z"/>
        <use href="#jaw" transform="rotate(120 32 32)"/>
        <use href="#jaw" transform="rotate(240 32 32)"/>
      </g>
    </svg>
    <h1 id="heading"></h1>
  </main>
  <script>
    (function () {
      var model;
      try { model = JSON.parse(new URLSearchParams(location.search).get('model') || '{}'); } catch (e) { model = {}; }
      var root = document.documentElement;
      var colors = model.colors || {};
      if (colors.background) root.style.setProperty('--bg', colors.background);
      if (colors.foreground) root.style.setProperty('--ink', colors.foreground);
      // A dark shell gets the logo's dark colors.
      var hex = String(colors.background || '#DDE3E6').slice(1);
      var r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
      if ((0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.5) root.classList.add('is-dark');

      var page = document.getElementById('page');
      page.className = model.view === 'error' ? 'error' : 'launch';
      document.getElementById('heading').textContent = model.heading || '';
      if (model.view === 'error') {
        page.setAttribute('role', 'alert');
        if (model.message) {
          var message = document.createElement('pre');
          message.className = 'message';
          message.textContent = model.message;
          page.appendChild(message);
        }
        if (model.folder) {
          var folder = document.createElement('p');
          folder.className = 'folder';
          folder.textContent = model.folder;
          page.appendChild(folder);
        }
      }
      var actions = model.actions || [];
      if (actions.length) {
        var row = document.createElement('div');
        row.className = 'actions';
        actions.forEach(function (action) {
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = action.label;
          if (action.primary) button.className = 'primary';
          button.addEventListener('click', function () { window.latheLocal && window.latheLocal.act(action.id); });
          row.appendChild(button);
        });
        page.appendChild(row);
        var first = row.querySelector('.primary') || row.querySelector('button');
        if (first) first.focus();
      }
    })();
  </script>
</body>
</html>
