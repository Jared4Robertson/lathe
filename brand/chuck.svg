<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lathe">
  <!-- A three-jaw lathe chuck: the body in steel, and the jaws, stepped like real chuck jaws, gripping at the centre in spark orange. -->
  <defs>
    <mask id="chuck-cut">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="32" r="9" fill="#000"/>
      <rect id="chuck-slot" x="27.5" y="0" width="9" height="24" fill="#000"/>
      <use href="#chuck-slot" transform="rotate(120 32 32)"/>
      <use href="#chuck-slot" transform="rotate(240 32 32)"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="29" style="fill:var(--b,#2E6A88)" mask="url(#chuck-cut)"/>
  <g style="fill:var(--a,#B5512A)">
    <path id="chuck-jaw" d="M29.6 22.6V17.5H28.6V11H35.4V17.5H34.4V22.6Z"/>
    <use href="#chuck-jaw" transform="rotate(120 32 32)"/>
    <use href="#chuck-jaw" transform="rotate(240 32 32)"/>
  </g>
</svg>
