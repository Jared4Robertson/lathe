# The full local checks, run on every pushed branch so the heavy suites run here instead of on a
# workstation. A branch merges into main only when this workflow passed on its head commit. The
# performance suites (timing budgets need a quiet machine) and the desktop smoke test (macOS only)
# stay local.
name: Checks

on:
  push:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The desktop package's Electron binary is only needed for the smoke test, which runs on macOS only.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  static-and-unit:
    name: Types, knip, tests and lathe check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            lathe/package-lock.json
            app/package-lock.json
            desktop/package-lock.json
            examples/tool-library/package-lock.json
      - name: Install
        run: |
          npm ci --prefix lathe
          npm ci --prefix app
          npm ci --prefix desktop
          npm ci --prefix examples/tool-library
      - name: Type checks
        run: |
          npm --prefix lathe run typecheck
          (cd app && npx tsc --noEmit)
          npm --prefix desktop run typecheck
          npm --prefix examples/tool-library run typecheck
      - name: Knip
        run: |
          npm --prefix lathe run knip
          npm --prefix app run knip
          npm --prefix desktop run knip
      - name: Lathe tests
        run: npm --prefix lathe test
      - name: App tests
        run: npm --prefix app test
      - name: Desktop tests
        run: npm --prefix desktop test
      - name: Tool Library tests
        run: npm --prefix examples/tool-library test
      - name: lathe check
        run: npm --prefix lathe run check

  browser:
    name: Stability and accessibility suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            lathe/package-lock.json
            app/package-lock.json
      - name: Install
        run: |
          npm ci --prefix lathe
          npm ci --prefix app
      - name: Install Chromium
        run: (cd app && npx playwright install --with-deps chromium)
      - name: Stability suite
        run: npm --prefix app run test:stability
      - name: Accessibility suite
        if: success() || failure()
        run: npm --prefix app run test:a11y
      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            app/stability/results
            app/a11y/results
          retention-days: 7
