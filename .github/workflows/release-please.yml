# Keeps a release PR open on main (the version bump and CHANGELOG.md, grouped by commit type, from commits anywhere in the repo); merging it tags
# the release and publishes it on GitHub. Its settings are release-please-config.json and .release-please-manifest.json.
# Nothing is published to npm.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # googleapis/release-please-action v5.0.0, pinned by commit.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
