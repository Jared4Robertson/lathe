<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser chrome takes the top bar's color; app/src/shell/themeColor.ts keeps it in step with the theme. -->
    <meta name="theme-color" content="#FFFFFF" />
    <title>Lathe</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The fonts are the app's own (app/src/fonts.css, app/public/fonts), so it works offline. Preloaded, so the
         text draws in them from the first frame; with font-display: optional it never swaps (LA-PAT-APP-UX-R08). -->
    <link rel="preload" href="/fonts/archivo/archivo-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo/archivo-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/public-sans/public-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/public-sans/public-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono/jetbrains-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // The chosen theme and mode, before first paint, so the page never flashes another theme
      // (app/src/platform/appearance/repository.ts writes these keys; app/src/theme/apply.ts does the same once the app runs).
      try {
        var root = document.documentElement;
        var mode = JSON.parse(localStorage.getItem('lathe:color-mode') || '"system"');
        if (mode === 'light' || mode === 'dark') root.setAttribute('data-mode', mode);
        var css = localStorage.getItem('lathe:theme-css');
        var chosen = JSON.parse(localStorage.getItem('lathe:theme') || '"lathe"');
        if (css) {
          var style = document.createElement('style');
          style.id = 'lathe-theme';
          style.textContent = css;
          document.head.appendChild(style);
          root.setAttribute('data-theme', String(chosen));
        }
      } catch (e) { /* no storage: the stylesheet's own Lathe theme, following the system */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
